<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>湘寻 · 湘潭大学校园失物招领</title>
  <meta name="description" content="湘寻（XiangFind）：湘潭大学校园失物招领平台。捡到的东西有处可去，丢的东西有人帮找。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="#/plaza">
      <span class="brand-mark">湘</span>
      <span class="brand-text">
        <b>湘寻</b>
        <i>XIANGFIND</i>
      </span>
    </a>

    <nav class="nav" id="nav">
      <a href="#/plaza" data-nav="plaza">广场</a>
      <a href="#/publish" data-nav="publish">发布</a>
      <a href="#/me" data-nav="me">我的</a>
      <a href="#/messages" data-nav="messages">消息<span class="badge" id="unread" hidden>0</span></a>
      <a href="#/admin" data-nav="admin">后台</a>
    </nav>

    <div class="topbar-right">
      <a class="btn btn-ghost" href="#/login" id="login-btn">登录</a>
    </div>
  </header>

  <main>

    <!-- ① 信息广场 -->
    <section class="view on" id="view-plaza">
      <div class="page-head">
        <h1>校园失物招领广场</h1>
        <p>捡到的东西有处可去，丢的东西有人帮找。</p>
      </div>

      <div class="toolbar">
        <div class="seg" id="type-seg">
          <button data-type="all" class="on">全部</button>
          <button data-type="lost">失物</button>
          <button data-type="found">招领</button>
        </div>
        <input class="input" id="q" type="search" placeholder="搜物品、地点，如「耳机」「图书馆」" autocomplete="off">
        <button class="btn" id="search-btn">搜索</button>
      </div>

        <div class="chips" id="cats"></div>

        <div class="filters">
          <label class="filter">
            <span>状态</span>
            <select class="input" id="f-status">
              <option value="all">全部状态</option>
              <option value="open">进行中</option>
              <option value="stored">已存放</option>
              <option value="claim_pending">认领中</option>
              <option value="ready_for_pickup">待领取</option>
              <option value="returned">已归还</option>
              <option value="archived">已归档</option>
            </select>
          </label>
          <label class="filter">
            <span>贵重</span>
            <select class="input" id="f-value">
              <option value="all">不限</option>
              <option value="normal">普通</option>
              <option value="valuable">贵重</option>
            </select>
          </label>
          <label class="filter">
            <span>存放点</span>
            <select class="input" id="f-point">
              <option value="all">全部存放点</option>
            </select>
          </label>
          <button class="btn btn-ghost btn-sm" id="f-reset" type="button">重置筛选</button>
        </div>


      <div class="grid" id="plaza-grid"></div>
      <div class="more-wrap"><button class="btn btn-ghost" id="plaza-more" hidden>加载更多</button></div>
      <div class="empty" id="plaza-empty" hidden>没有找到符合条件的物品，换个关键词试试。</div>
    </section>

    <!-- ② 发布 -->
    <section class="view" id="view-publish">
      <div class="page-head">
        <h1>发布信息</h1>
        <p>丢了东西发「失物」，捡到东西发「招领」。审核通过后展示在广场。</p>
      </div>

      <form class="card publish-form" id="form-publish" novalidate>
        <div class="seg" id="pub-type">
          <button type="button" data-type="lost" class="on">我丢了东西</button>
          <button type="button" data-type="found">我捡到东西</button>
        </div>

        <label class="field"><span>标题 <i>*</i></span>
          <input class="input" name="title" maxlength="60" placeholder="如：白色蓝牙耳机（带充电盒）">
        </label>

        <div class="grid-2">
          <label class="field"><span>分类 <i>*</i></span>
            <select class="input" name="category">
              <option value="证件">证件</option>
              <option value="电子产品">电子产品</option>
              <option value="钥匙">钥匙</option>
              <option value="书籍">书籍</option>
              <option value="衣物">衣物</option>
              <option value="其他">其他</option>
            </select>
          </label>
          <label class="field"><span>价值</span>
            <select class="input" name="valueLevel">
              <option value="normal">普通</option>
              <option value="valuable">贵重（只能存保卫处）</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label class="field"><span>地点 <i>*</i></span>
            <input class="input" name="location" maxlength="80" placeholder="如：图书馆三楼自习区">
          </label>
          <label class="field"><span>发生时间</span>
            <input class="input" name="eventAt" type="datetime-local">
          </label>
        </div>

        <label class="field" id="pub-storage-wrap"><span>存放点 <i>*</i></span>
          <select class="input" name="storagePointId"></select>
        </label>

        <label class="field"><span>描述 <i>*</i></span>
          <textarea class="input area" name="description" maxlength="500" rows="4" placeholder="外观、磨损、内容物……越具体越容易被认出来"></textarea>
        </label>

        <label class="field">
          <span>图片 <i>可选，最多 3 张，单张 ≤ 5MB</i></span>
          <input class="input" id="pub-images" type="file" accept="image/jpeg,image/png,image/webp" multiple>
        </label>
        <div class="pub-previews" id="pub-previews"></div>

        <p class="auth-msg" id="pub-msg" hidden></p>
        <div class="pub-actions">
          <button class="btn" type="submit">提交</button>
          <span class="pub-hint">提交后进入审核，可在「我的」里修改</span>
        </div>
      </form>
    </section>

    <!-- ③ 物品详情 -->
    <section class="view" id="view-item">
      <a class="back" href="#/plaza">← 返回广场</a>
      <div id="detail-root"></div>
    </section>

    <!-- ④ 我的中心 -->
        <section class="view" id="view-me">
      <div id="me-root"></div>
    </section>

    <!-- ⑤ 消息中心 -->
        <section class="view" id="view-messages">
      <div id="messages-root"></div>
    </section>

    <!-- ⑥ 管理后台 -->
        <section class="view" id="view-admin">
      <div id="admin-root"></div>
    </section>

    <!-- ⑦ 登录 / 注册 -->
    <section class="view" id="view-login">
      <div class="auth-wrap">
        <div class="auth-card">
          <div class="auth-tabs" id="auth-tabs">
            <button type="button" data-auth-tab="login" class="on">登录</button>
            <button type="button" data-auth-tab="register">注册</button>
          </div>

          <form class="auth-form" id="form-login">
            <label class="field"><span>学号</span>
              <input class="input" id="login-student" name="studentId" inputmode="numeric" autocomplete="username" placeholder="如 20230001" required>
            </label>
            <label class="field"><span>密码</span>
              <input class="input" id="login-pass" name="password" type="password" autocomplete="current-password" placeholder="至少 8 位" required>
            </label>
            <p class="auth-msg" id="login-msg" hidden></p>
            <button class="btn auth-submit" type="submit">登录</button>
            <p class="auth-hint">演示账号：20230001 / demo1234</p>
            <p class="auth-hint"><a href="#/forgot" class="link">忘记密码？</a></p>
          </form>

          <form class="auth-form" id="form-register" hidden>
            <label class="field"><span>学号</span>
              <input class="input" name="studentId" inputmode="numeric" placeholder="如 20230001" required>
            </label>
            <label class="field"><span>姓名</span>
              <input class="input" name="name" placeholder="真实姓名（仅用于核对身份）" required>
            </label>
            <label class="field"><span>校园邮箱</span>
              <input class="input" name="email" type="email" placeholder="name@xtu.edu.cn" required>
            </label>
            <label class="field"><span>密码</span>
              <input class="input" name="password" type="password" minlength="8" placeholder="至少 8 位，含字母与数字" required>
            </label>
            <label class="field"><span>确认密码</span>
              <input class="input" name="confirmPassword" type="password" minlength="8" required>
            </label>
            <p class="auth-msg" id="reg-msg" hidden></p>
            <button class="btn auth-submit" type="submit">发送验证码</button>
          </form>

          <form class="auth-form" id="form-verify" hidden>
            <p class="auth-note">验证码已发送到 <b id="verify-email"></b>，10 分钟内有效。</p>
            <label class="field"><span>6 位验证码</span>
              <input class="input" name="code" inputmode="numeric" maxlength="6" placeholder="000000" required>
            </label>
            <p class="auth-msg" id="verify-msg" hidden></p>
            <button class="btn auth-submit" type="submit">验证并登录</button>
            <button class="auth-link" type="button" id="verify-back">换一个邮箱</button>
            <p class="auth-hint">开发环境未配 SMTP，验证码请查看服务端日志（<code>[mail:dev]</code>）。</p>
          </form>
        </div>
      </div>
    </section>

    <!-- ⑧ 忘记密码 -->
    <section class="view" id="view-forgot">
      <div class="auth-wrap">
        <div class="auth-card">
          <h2 class="auth-title">找回密码</h2>
          <p class="auth-hint">用注册时绑定的校园邮箱接收 6 位验证码，验证码 15 分钟内有效。</p>

          <div class="auth-form" id="forgot-step1">
            <label class="field"><span>校园邮箱</span>
              <input class="input" id="forgot-email" type="email" placeholder="name@xtu.edu.cn" autocomplete="email" required>
            </label>
            <p class="auth-msg" id="forgot-msg1" hidden></p>
            <button class="btn auth-submit" type="button" id="forgot-send">发送验证码</button>
          </div>

          <div class="auth-form" id="forgot-step2" hidden>
            <label class="field"><span>验证码</span>
              <input class="input" id="forgot-code" inputmode="numeric" maxlength="6" placeholder="邮件里的 6 位数字">
            </label>
            <label class="field"><span>新密码</span>
              <input class="input" id="forgot-pass" type="password" autocomplete="new-password" placeholder="8-64 位，含字母和数字">
            </label>
            <label class="field"><span>确认新密码</span>
              <input class="input" id="forgot-pass2" type="password" autocomplete="new-password" placeholder="再输一次">
            </label>
            <p class="auth-msg" id="forgot-msg2" hidden></p>
            <button class="btn auth-submit" type="button" id="forgot-submit">重置密码</button>
          </div>

          <p class="auth-hint"><a href="#/login" class="link">← 返回登录</a></p>
        </div>
      </div>
    </section>

  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
