<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>harness</title></head>
<body>
<!-- E2E harness：被 tests/e2e/run.mjs 用无头 Edge 打开，跑完把结果写进 title -->
<iframe id="app" style="width:420px;height:900px;border:0"></iframe>
<script>
const params = new URLSearchParams(location.search);
const BASE = params.get('base') || 'http://127.0.0.1:3000';
const SCENARIO = params.get('scenario') || 'login';
const frame = document.getElementById('app');

const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const finish = (obj) => { document.title = 'RESULT:' + JSON.stringify(obj); };

async function boot(hash) {
  frame.src = BASE + '/index.html' + (hash || '#/plaza');
  await new Promise((r) => { frame.onload = r; });
  await wait(1200);
  return { d: frame.contentDocument, w: frame.contentWindow };
}

  // headless 下原生 confirm/alert 会阻塞，统一打桩
  frame.contentWindow.confirm = () => true;
  frame.contentWindow.alert = () => {};

async function login(d, w, studentId, password) {
  w.location.hash = '#/login';
  await wait(800);
  const form = d.getElementById('form-login');
  form.studentId.value = studentId;
  form.password.value = password;
  form.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
  await wait(2000);
}

const SCENARIOS = {
  async login() {
    const { d, w } = await boot('#/login');
    await login(d, w, '20230001', 'demo1234');
    return { who: d.getElementById('login-btn').textContent.trim(), hash: w.location.hash };
  },

  async plaza() {
    const { d, w } = await boot('#/plaza');
    await wait(1200);
    return { cards: d.querySelectorAll('#plaza-grid .card').length, empty: !d.getElementById('plaza-empty').hidden };
  },

  async detail() {
    const { d } = await boot('#/item/itm_demo_1');
    await wait(1200);
    return { title: d.querySelector('.detail-head h1')?.textContent || '', rows: d.querySelectorAll('.kv-row').length };
  },

  async claim() {
    // 自己造夹具：志愿者发布一条招领 → 换学生登录认领。
    // 不能靠 seed 数据（自己没有可认领的），更不能把 skipped 当通过（#76）。
    const { d, w } = await boot('#/login');
    const csrfOf = () => {
      const m = d.cookie.match(/xf_csrf=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : '';
    };
    const apiCall = (path, opts) => w.fetch(path, {
      ...opts,
      headers: {
        'content-type': 'application/json',
        accept: 'application/json',
        'x-csrf-token': csrfOf(),
        ...(opts && opts.headers),
      },
    });

    // ① 志愿者发布一条普通招领（图书馆点）
    await login(d, w, '20230002', 'demo1234');
    const created = await apiCall('/api/items', {
      method: 'POST',
      body: JSON.stringify({
        type: 'found',
        title: 'E2E 认领夹具 ' + String(Date.now()).slice(-6),
        category: '其他',
        description: '自动化夹具：蓝色折叠伞，伞柄黄色手绳，伞面右下角有一块补丁，伞骨断了一根。',
        location: '图书馆三楼自习区',
        valueLevel: 'normal',
        storagePointId: 'stp_demo_lib',
      }),
    });
    const createdBody = await created.json();
    const target = createdBody.item;
    if (!target) throw new Error('夹具创建失败：' + JSON.stringify(createdBody));

    // ② 换学生登录
    await apiCall('/api/auth/logout', { method: 'POST' });
    await login(d, w, '20230001', 'demo1234');

    // ③ 打开该物品认领
    w.location.hash = '#/item/' + target.id;
    await wait(1600);
    const btn = d.querySelector('.claim-box .btn');
    if (!btn || btn.disabled) throw new Error('认领按钮不可用：' + (btn ? btn.textContent : 'missing'));
    btn.click();
    await wait(600);
    const modal = Boolean(d.querySelector('.modal-mask'));
    d.querySelector('.modal .btn-ghost')?.click();
    await wait(200);

    // ④ 收尾：换回夹具作者（志愿者）再归档——用学生 session 归档别人的物品会 403
    await apiCall('/api/auth/logout', { method: 'POST' });
    await login(d, w, '20230002', 'demo1234');
    const arch = await apiCall('/api/items/' + target.id, { method: 'PATCH', body: JSON.stringify({ status: 'archived' }) });
    if (!arch.ok) {
      const t = await arch.text();
      throw new Error('夹具归档失败（HTTP ' + arch.status + '）：' + t.slice(0, 120));
    }


    return { canClaim: true, item: target.id, modal };
  },


  async publish() {
    const { d, w } = await boot('#/login');
    await login(d, w, '20230001', 'demo1234');
    w.location.hash = '#/publish';
    await wait(1500);

    const form = d.getElementById('form-publish');
    // 招领：切到 found，存放点必填
    d.querySelector('#pub-type button[data-type="found"]').click();
    await wait(300);
    const stamp = String(Date.now()).slice(-6);
    form.elements.title.value = 'E2E 测试雨伞 ' + stamp;
    form.elements.category.value = '其他';
    form.elements.location.value = '第三教学楼 101';
    form.elements.description.value = '自动化测试创建：蓝色折叠伞，伞柄有黄色手绳，伞面有一处补丁。';
    await wait(300);

    const pointSel = form.elements.storagePointId;
    if (pointSel && pointSel.options.length > 1) pointSel.selectedIndex = 1;

    form.dispatchEvent(new w.Event('submit', { bubbles: true, cancelable: true }));
    await wait(2500);

    return {
      stamp,
      hash: w.location.hash,
      moved: w.location.hash.startsWith('#/item/'),
      title: d.querySelector('.detail-head h1')?.textContent || '',
    };
  },

  async admin() {
    const { d, w } = await boot('#/login');
    await login(d, w, '90000001', 'demo1234');
    w.location.hash = '#/admin';
    await wait(1800);
    return {
      tabs: [...d.querySelectorAll('.admin-tabs button')].map((b) => b.textContent),
      kpis: d.querySelectorAll('.admin-kpi').length,
    };
  },

  async forbidden() {
    const { d, w } = await boot('#/login');
    await login(d, w, '20230001', 'demo1234');
    w.location.hash = '#/admin';
    await wait(1500);
    return { guarded: !d.querySelector('.admin-kpis'), text: d.querySelector('.empty')?.textContent || '' };
  },
};

(async () => {
  const errors = [];
  try {
    const run = SCENARIOS[SCENARIO];
    if (!run) return finish({ error: 'unknown scenario: ' + SCENARIO });
    const out = await run();
    finish({ scenario: SCENARIO, ok: true, errors, ...out });
  } catch (err) {
    finish({ scenario: SCENARIO, ok: false, errors, error: String(err && err.message || err) });
  }
})();
</script>
</body>
</html>
