# 湘寻 · Nginx 站点配置
# 放到 /etc/nginx/sites-available/xiangfind，然后 ln -s 到 sites-enabled
# 把 xiangfind.example.com 换成你的域名（没有域名就先用 IP，HTTPS 段先注释掉）

# 上游：Node 服务（systemd 管的那个）
upstream xiangfind_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP：先只做跳转，等证书签发后再放开（certbot 需要 80 端口可用）
server {
    listen 80;
    listen [::]:80;
    server_name xiangfind.example.com;

    # 证书签发路径（certbot --webroot 会用到）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xiangfind.example.com;

    # certbot 会自动填这一段；手工签发的话把路径改成你的
    ssl_certificate     /etc/letsencrypt/live/xiangfind.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xiangfind.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 图片上传：单张 5MB、最多 3 张，留出 multipart 开销
    client_max_body_size 20m;

    # 压缩（只压文本，图片已压缩过不要再压）
    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 用户上传的图片：长缓存（文件名是随机 UUID，不会变）
    location /uploads/ {
        proxy_pass http://xiangfind_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查：只允许本机与监控访问
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://xiangfind_app;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://xiangfind_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_buffering on;
    }

    access_log /var/log/nginx/xiangfind.access.log;
    error_log  /var/log/nginx/xiangfind.error.log warn;
}
